[package]
name = "hypernext-keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Shared error type (ADR 0009): From<KeychainError> for HypernextError lives
# here to avoid a core -> keychain dependency cycle (t4 decision).
hypernext-core = { workspace = true }
# Keychain (ADR 0007)
keyring = { workspace = true }
# keyring-core: the store layer. Operations go through keyring_core::Entry so
# tests can install the in-memory mock store and production can install the
# real platform store, without being blocked by keyring v1's one-time
# platform-init gate (which fails on headless Linux and would otherwise poison
# every later keyring::Entry::new with NoDefaultStore).
keyring-core = "1"
# Errors (ADR 0009)
thiserror = { workspace = true }

[dev-dependencies]

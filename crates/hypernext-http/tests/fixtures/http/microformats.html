<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Page With H-Card</title>
</head>
<body>
  <article>
    <div class="h-card">
      <span class="p-name">Jane Author</span>
      <a class="u-email" href="mailto:jane@example.com">jane@example.com</a>
      <span class="p-org">Example Org</span>
    </div>
    <p>An author profile page that uses the microformats h-card vocabulary to expose author metadata.</p>
  </article>
</body>
</html>

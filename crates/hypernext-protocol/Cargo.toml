[package]
name = "hypernext-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hypernext protocol dispatcher and adapters (ADR 0006 smolnet protocol crates)"

[dependencies]
# Smolnet protocol crates (ADR 0006) — direct crates.io deps, pinned in workspace lockfile
gemini-protocol = { workspace = true }
scroll-protocol = { workspace = true }
text-protocol = { workspace = true, features = ["tls"] }
spartan-protocol = { workspace = true }
nex-protocol = { workspace = true }
gopher-protocol = { workspace = true }
scorpion-protocol = { workspace = true, features = ["client"] }
kepler-protocol = { workspace = true, features = ["client"] }
guppy-protocol = { workspace = true }
finger-protocol = { workspace = true }
dict-protocol = { workspace = true }
titanite = { workspace = true }

# Errors + domain model (ADR 0009, Phase 1)
thiserror = { workspace = true }
hypernext-core = { workspace = true }

# URL parsing + async
url = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

# Async trait objects + cancellation (contract)
async-trait = { workspace = true }
tokio-util = { workspace = true }

# HTTP client reference in FetchContext
reqwest = { workspace = true }

# Keychain + store access in FetchContext
hypernext-keychain = { workspace = true }
hypernext-store = { workspace = true }
rusqlite = { workspace = true }

# TLS (TOFU pinning + integration test server)
rustls = { workspace = true }
tokio-rustls = { workspace = true }
sha2 = { workspace = true }

# Markdown parsing (text/markdown bodies)
comrak = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }

[workspace]
resolver = "2"
members = [
    "crates/hypernext-app",
    "crates/hypernext-ui",
    "crates/hypernext-core",
    "crates/hypernext-store",
    "crates/hypernext-keychain",
    "crates/hypernext-testutil",
    "crates/hypernext-protocol",
    "crates/hypernext-pgp",
    "crates/hypernext-http",
    "crates/hypernext-webmode",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Hypernext maintainers"]

[workspace.dependencies]
# Async runtime (ADR 0008)
tokio = { version = "1.53", features = ["full"] }

# Async traits in trait objects (async-trait) + cancellation tokens (tokio-util)
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP client (SSRF defense, redirects, size limits)
# `rustls` feature enables HTTPS (WebFinger RFC 7033 and raw-mode HTTP);
# default-features off + rustls keeps the TLS stack minimal and system-provider backed.
# No `http2`: it would pull an h2 version not in the local registry index.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Storage (ADR 0004)
# NOTE: rusqlite pinned to 0.39 (not 0.40) because refinery-core 0.9.2 caps
# rusqlite at "<=0.39" -- 0.40 would resolve a second rusqlite copy and break
# the shared Connection type. Feature name is modern_sqlite (underscore).
rusqlite = { version = "0.39", features = ["bundled", "modern_sqlite"] }
refinery = { version = "0.9", features = ["rusqlite"] }
sqlite-vec = "0.1"

# UI (ADR 0001)
# 0.11 targets gtk4 0.11; bumped together. webkit6 0.6 needs gtk4 0.11 (see ADR 0002),
# and relm4 0.11 is the matching release. See worklog for the approved MSRV/edition contract change.
relm4 = "0.11"
gtk4 = "0.11"

# Keychain (ADR 0007)
keyring = "4"

# OpenPGP verification (rpgp; sequoia-openpgp rejected: LGPL, see p2-t7 spike in worklog)
# rust-version 1.88 > MSRV 1.83; toolchain 1.97 resolves (same accepted pattern as smolnet crates)
pgp = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
url = { version = "2.5", features = ["serde"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4", "serde"] }

# Errors (ADR 0009)
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Filesystem locations (macOS data dir: ~/Library/Application Support)
dirs = "6"

# Smolnet protocol crates (ADR 0006) — direct crates.io deps, pinned, never vendored
# 6 declare rust-version 1.88 (> Hypernext MSRV 1.83); toolchain 1.97 resolves, flag for CI
# Note: guppy-protocol is the Molerat crate (guppy:// = Molerat protocol)
gemini-protocol = "0.1.2"
scroll-protocol = "0.1.0"
text-protocol = "0.1.0"
spartan-protocol = "0.1.1"
nex-protocol = "0.1.1"
gopher-protocol = "0.1.2"
scorpion-protocol = "0.1.0"
kepler-protocol = "0.1.0"
guppy-protocol = "0.1.1"
finger-protocol = "0.1.1"
dict-protocol = "0.1.0"
titanite = "0.3.2"

# Internal workspace crates (path deps for From-impl propagation)
hypernext-core = { path = "crates/hypernext-core" }
hypernext-http = { path = "crates/hypernext-http", version = "0.1.0" }
hypernext-store = { path = "crates/hypernext-store" }
hypernext-keychain = { path = "crates/hypernext-keychain" }
hypernext-webmode = { path = "crates/hypernext-webmode" }

# Raw-mode webview platform bindings (phase 3, p3-t4; ADR 0002 SPIKE).
# Target-gated in hypernext-webmode's Cargo.toml; only the current platform's
# binding is built. webkit6 0.6 requires gtk4 0.11, which the workspace now pins
# (Linux webkit6 raw-webview backend enabled; see ADR 0002). Windows webview2-com
# is the post-1.0 target; macOS uses objc2 WKWebView (Fallback A).
webkit6 = "0.6"
objc2 = { version = "0.6", default-features = false }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSURL", "NSURLRequest", "NSGeometry", "NSObject", "NSArray",
] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSApplication"] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView", "WKWebViewConfiguration", "WKNavigationDelegate", "WKUIDelegate",
    "WKNavigationAction", "WKWindowFeatures", "WKWebpagePreferences",
] }
webview2-com = "0.39"

# Testing (dev-deps)
pretty_assertions = "1"
rstest = "0.26"
mockall = "0.15"
wiremock = "0.6"

# TLS (gemini adapter + integration test server)
rustls = "0.23"
tokio-rustls = "0.26"
sha2 = "0.10"
rcgen = "0.13"

# Markdown parsing (text/markdown bodies)
comrak = "0.54"

# Ad filtering (p3-t3; Brave adblock-rust, audited in protocol-crate-audit.md)
# License: MPL-2.0 (Brave adblock-rust) -- MPL-2.0 is on the allowed list.
adblock = "0.13"
# CSS selector matching for cosmetic filtering (shared html5ever with scraper/legible)
# HTML readability extraction (p3-t2; legible v0.5.1 Rust Readability.js port)
# API: legible::parse(&str, Option<&str>, Option<Options>) -> Result<Article, legible::Error>
legible = "0.5"
# HTML querying for metadata/microformats (ISC; shares html5ever 0.39 with legible)
scraper = { version = "0.27", default-features = false }
# Internal workspace crate (path dep for From-impl propagation)
hypernext-pgp = { path = "crates/hypernext-pgp" }

# Crate -> adapter mapping (full smolweb parity, 13 crates from merely-made/smolweb)
# NOTE: guppy-protocol is Guppy v0.4.4 (UDP 6775, smolweb over UDP) - NOT Molerat.
# jcs's Molerat (TLS, mtxt) has NO crate in the smolweb set - implement first-party.
# misfin (mail) DEFERRED to Correspondence 4.0 phase - not in Phase 2.
crate_adapter_map:
  gemini-protocol: GeminiAdapter        # Gemini + TOFU + titan upload
  gopher-protocol: GopherAdapter        # Gopher + Gopher+ + gophers (TLS)
  spartan-protocol: SpartanAdapter      # plaintext TCP + uploads via =: prompt
  nex-protocol: NexAdapter              # plaintext TCP, minimal
  text-protocol: TextAdapter            # plaintext + TLS, 3 status codes
  scroll-protocol: ScrollAdapter        # TLS, scrolltext, UDC
  guppy-protocol: GuppyAdapter          # Guppy v0.4.4, UDP (chunking/ack/retransmit)
  scorpion-protocol: ScorpionAdapter    # 4 subprotocols, binary blocks
  kepler-protocol: KeplerAdapter        # Gemini shape + cache model
  finger-protocol: FingerWebFingerAdapter  # Finger RFC 1288 + WebFinger RFC 7033
  dict-protocol: DictAdapter            # DICT RFC 2229 (command loop, not one-shot)
  # fsp-protocol: DEFERRED to Workshop 3.0 (sftp/telnet/mud phase)
  titanite: TitanAdapter                # Titan upload
  # Molerat: first-party (no crate; jcs TLS/mtxt protocol)


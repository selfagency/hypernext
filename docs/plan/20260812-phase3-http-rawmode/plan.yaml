plan_id: 20260812-phase3-http-rawmode
objective: "Phase 3 HTTP Reader Mode & Raw Mode Webview: hypernext-http crate (SSRF policy, HTML readability extraction, ad filtering), hypernext-webmode crate (raw webview widget + macOS GTK4 SPIKE, web mode toggle), reader-view rendering pipeline, HTTP adapter in dispatcher with PGP-before-extract boundary"
complexity: HIGH
source_doc: docs/phases/03-http-reader-and-raw-mode.md
created: "2026-08-12"
revised: "2026-08-12 (initial plan; carries Phase 2 handoffs h1-h4)"

# phase-2 -> phase-3 handoff carries (recorded in phase-2 plan + context envelope)
handoff_to_phase_3:
  - id: h1
    desc: "Register prefix-less http/https default adapter (currently every ordinary http(s) fetch returns UnknownScheme; http/https adapter is p3-t7)"
    target: p3-t7
  - id: h2
    desc: "Promote spike_textview (text-selection ADR) to production + wire link TextTag activate -> navigator"
    target: p3-t6
  - id: h3
    desc: "Per-protocol fixture widget-tree render tests (deferred phase-2 exit criterion)"
    target: p3-t6
  - id: h4
    desc: "GtkTextTag CSS for the promoted render path"
    target: p3-t6

# New crates for Phase 3
crate_map:
  hypernext-http: "3.1 policy.rs + client.rs; 3.2 extract.rs; 3.3 adblock.rs"
  hypernext-webmode: "3.4 raw_widget.rs (platform-conditional webview); 3.5 lib.rs WebMode"

# Wave 3 carries the single biggest technical risk of Phase 3: the macOS
# WKWebView + GTK4 integration SPIKE (3.4). This must produce an documented
# approach in the ADR (docs/references/0002-browser-engine-survey.md) BEFORE
# production code locks in. Fallbacks: separate window (worse UX) or drop raw
# mode to 1.1 (scope cut) - decide in the SPIKE.

tasks:
  - id: p3-t1
    title: "hypernext-http crate core: FetchPolicy + client (SSRF, size, redirects)"
    wave: 1
    agent: gem-implementer
    status: pending
    deps: []
    conflicts_with: []
    source: "phase-doc 3.1"
    acceptance: "crates/hypernext-http with policy.rs (check_url: http/https only, RFC1918/loopback/link-local + DNS-rebinding via resolved-IP check) + client.rs (build_client: custom redirect policy per-hop check_url, timeout, socks5 feature). Bounded streaming size reader (no ReadAll overflow). TDD gate: unit (scheme/private-IP/DNS-rebind/redirect-hop) + wiremock integration (100MB->SizeLimitExceeded at 10MB, 301->127.0.0.1 blocked, 6 chained redirects -> 6th fails). ≥80% coverage on the crate."

  - id: p3-t2
    title: "HTML parsing + readability extraction (legible/scraper/comrak) in extract.rs"
    wave: 2
    agent: gem-implementer
    status: pending
    deps: [p3-t1]
    conflicts_with: []
    source: "phase-doc 3.2"
    acceptance: "extract.rs fetch_and_extract pipeline: GET -> raw bytes -> PGP verify (before extraction) -> content-type detect -> legible::extract for HTML / comrak for markdown / feed-rs handoff / text plain / Block::Raw binary -> Vec<Block> + Metadata (meta/JSON-LD/OG/Twitter/microformats) + DebugInfo. TDD gate: 8+ fixtures (simple-article, article-with-ads, feed, markdown.html, empty-body, missing-metadata, microformats h-card, JSON-LD) + wiremock integrations. PGP-verify-before-extract order enforced. ≥80% coverage."

  - id: p3-t3
    title: "Ad filtering (adblock crate, EasyList+EasyPrivacy bundled)"
    wave: 2
    agent: gem-implementer
    status: pending
    deps: [p3-t2]
    conflicts_with: []
    source: "phase-doc 3.3"
    acceptance: "adblock.rs AdblockEngine (Bundled EasyList+EasyPrivacy, build-time not runtime download) + should_block + cosmetic_rules_for, applied in extract.rs before legible. FilterListSource enum + per-origin toggle (settings) + never in incognito. TDD gate: tracker block true/false, EasyList empty edge, cosmetic selectors; wiremock: doubleclick img not requested, ad-banner div removed from PageDoc. ≥80% coverage."

  - id: p3-t4
    title: "Raw-mode webview widget + macOS WKWebView/GTK4 SPIKE (ADR 0002)"
    wave: 3
    agent: gem-implementer
    status: pending
    deps: [p3-t1]
    conflicts_with: []
    source: "phase-doc 3.4"
    acceptance: "SPIKE first: decide + document macOS WKWebView+GTK4 integration in docs/references/0002-browser-engine-survey.md (GtkSocket / wry / separate-window fallback) and pick a documented approach with fallback decision. Then hypernext-webmode raw_widget.rs: platform-conditional RawWebView (macOS objc2-web-kit via chosen approach; Linux webkit6; Windows webview2-com) with load_url, set_policy (WebviewPolicy incognito-safe defaults: scripts/storage/popups/downloads/cross-origin), navigation/decide_policy/create wiring (block popups/new-window to new tab, downloads need user confirmation). TDD gate: WebviewPolicy::default incognito-safe, RawWebView::new (display-required, xvfb-run on CI). ADR updated with chosen macOS approach + fallback decision."

  - id: p3-t5
    title: "Web mode toggle + per-origin persistence (webmode lib)"
    wave: 3
    agent: gem-implementer
    status: pending
    deps: []
    conflicts_with: []
    source: "phase-doc 3.5 (FR-8 semantics from bean-v1-prd)"
    acceptance: "hypernext-webmode lib.rs: WebMode enum (Reader/Raw), resolve_mode(url,store) default Reader, set_mode_pref(url,mode,store) in settings key webmode.<origin>, incognito forces Reader (no raw mode in incognito, documented). Settings UI control deferred to Phase 4. TDD gate: unknown origin -> Reader; set then resolve -> Raw; persists across DB re-open; incognito forces Reader; set Reader clears the pref row (no row, not a Reader row). ≥80% coverage."

  - id: p3-t6
    title: "Reader-mode rendering pipeline (reader_view.rs) + Phase 2 handoffs h2/h3/h4"
    wave: 4
    agent: gem-implementer
    status: pending
    deps: [p3-t2, p3-t3]
    conflicts_with: []
    source: "phase-doc 3.6 + phase-2 handoffs"
    acceptance: "hypernext-ui reader_view.rs render_page_doc(doc)->gtk::Widget: document_view::render_blocks + metadata header (title/author/date/PGP shield/share/read-state) + featured-image dedup + favicon in location bar. Fold in h2 (promote spike_textview to production + link TextTag activate->navigator), h3 (per-protocol fixture widget-tree render tests), h4 (GtkTextTag CSS). TDD gate: fixture PageDoc widget tree, featured-image dedup, empty-metadata no-panic."

  - id: p3-t7
    title: "HTTP adapter in dispatcher + PGP-before-extract boundary (h1)"
    wave: 4
    agent: gem-implementer
    status: pending
    deps: [p3-t2, p3-t3, p3-t4, p3-t5]
    conflicts_with: []
    source: "phase-doc 3.7 + phase-2 handoff h1"
    acceptance: "hypernext-protocol/src/adapters/http.rs HttpAdapter: Protocol::fetch resolves mode (Reader->fetch_and_extract, Raw->Block::Raw mime application/x-webview placeholder), register in default_dispatcher as the prefix-less http/https default (handoff h1 unblocks ordinary fetch). PGP verify BEFORE extract enforced (unit test asserts call order via tracing hook). TDD gate integrations: Dispatcher::fetch(https) returns PageDoc with blocks; PGP-signed HTML verified (PgpInfo), tampered -> PgpInvalid; webmode=Raw -> Block::Raw placeholder."

# Phase 3 -> Phase 4 exit criteria (from phase-doc section 4)
exit_criteria:
  - "hypernext-http fetches HTTPS with SSRF + size + redirect limits"
  - "legible extraction correct for 10+ fixture HTML files"
  - "ad filter blocks trackers in reader (cosmetic) + raw (resource intercept)"
  - "raw-mode webview works on macOS OR a documented fallback is in place (SPIKE)"
  - "web mode toggle persists per-origin; incognito forces reader"
  - "PGP verification runs before extraction in every path (tracing hook)"
  - "Dispatcher::fetch(https://...) returns a renderable PageDoc"
  - "cargo test --workspace passes with >=65% overall coverage"
  - "cargo clippy --workspace -- -D warnings clean"
  - "no --no-verify in git history"
  - "worklog.md up to date"
